[package]
name = "byetery-contract"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false

[lib]
# Native tests need only rlib. Emit cdylib explicitly for the WASM artifact to
# avoid the Windows DLL export limit on the SDK's native host dependencies.
crate-type = ["rlib"]

[features]
wasm-tests = []

[dependencies]
soroban-sdk = "=27.0.6"

[dev-dependencies]
soroban-sdk = { version = "=27.0.6", features = ["testutils"] }
sha2 = "=0.10.9"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.dev]
debug = 0

[profile.test]
debug = 0
